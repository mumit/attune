name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a time-dependent regression (e.g. a non-hermetic clock)
    # surfaces within 24h instead of waiting on the next PR.
    - cron: "0 7 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run attune tests
        run: pytest -q
      - name: Test stateless republisher
        run: |
          pip install -r deploy/republisher/requirements.txt pytest
          pytest deploy/republisher/test_main.py -q
